  function dashboard(){
    function splitHrs(field,hrs,name){
      var parts=field.split('/').map(function(s){return s.trim();}).filter(Boolean);
      if(!parts.length)return 0;
      return parts.indexOf(name)!==-1?hrs/parts.length:0;
    }

    // ── Reparto de horas por semana (días hábiles, solo tareas abiertas) ──────
    function pF(s){
      if(!s) return null;
      var t=String(s).trim(), m;
      if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
      if((m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/))) return new Date(+m[3],+m[2]-1,+m[1]);
      var d=new Date(t); return isNaN(d)?null:d;
    }
    // Lunes de la semana calendario a la que pertenece una fecha
    function lunesDe(d){
      var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());
      var dow=(x.getDay()+6)%7; // 0=lunes
      x.setDate(x.getDate()-dow);
      return x;
    }
    function esHabil(d){ var w=d.getDay(); return w>=1&&w<=5; }
    function keySemana(lunes){ return lunes.getFullYear()+'-'+(lunes.getMonth()+1)+'-'+lunes.getDate(); }
    function labelSemanaCal(lunes){
      var MN=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
      var dom=new Date(lunes); dom.setDate(dom.getDate()+6);
      return lunes.getDate()+' '+MN[lunes.getMonth()]+' – '+dom.getDate()+' '+MN[dom.getMonth()];
    }

    // Devuelve [{key, label, horas}] para UNA tarea
    function horasPorSemana(d){
      var comp = d.estado==='Completado';
      var fSol = pF(d.fecha), fLim = pF(d.fechaLimite);
      // Completada: todo el esfuerzo cae en la semana de cierre (o límite / solicitud si no hay cierre)
      if(comp){
        var base = pF(d.fechaCierre) || fLim || fSol;
        if(!base) return [];
        var l=lunesDe(base);
        return [{key:keySemana(l),label:labelSemanaCal(l),horas:d.esfuerzo}];
      }
      // Abierta: repartir por días hábiles entre Solicitud y Límite
      if(!fSol || !fLim || fLim<fSol){
        var l2=lunesDe(fLim||fSol||new Date());
        return l2?[{key:keySemana(l2),label:labelSemanaCal(l2),horas:d.esfuerzo}]:[];
      }
      var dias=[], cur=new Date(fSol);
      while(cur<=fLim){
        if(esHabil(cur)) dias.push(new Date(cur));
        cur.setDate(cur.getDate()+1);
      }
      if(!dias.length){
        var l3=lunesDe(fLim);
        return [{key:keySemana(l3),label:labelSemanaCal(l3),horas:d.esfuerzo}];
      }
      var porDia = d.esfuerzo/dias.length;
      var acc={};
      dias.forEach(function(dd){
        var l=lunesDe(dd), k=keySemana(l);
        if(!acc[k]) acc[k]={key:k,label:labelSemanaCal(l),lunes:l,horas:0};
        acc[k].horas += porDia;
      });
      return Object.keys(acc).map(function(k){return acc[k];})
        .sort(function(a,b){return a.lunes-b.lunes;});
    }

    // Agregado para TODAS las tareas filtradas → [{key,label,horas}]
    function horasPorSemanaTotal(rows){
      var acc={};
      rows.forEach(function(d){
        horasPorSemana(d).forEach(function(s){
          if(!acc[s.key]) acc[s.key]={key:s.key,label:s.label,horas:0,lunes:s.lunes};
          acc[s.key].horas += s.horas;
        });
      });
      return Object.keys(acc).map(function(k){return acc[k];})
        .sort(function(a,b){return a.lunes-b.lunes;});
    }


    // Jira palette
    var JBG='#F4F6F8',JCARD='#FFFFFF',JBR='#DDE2E8',JTX='#0A0E14',JMT='#66717F';
    var JBL='#1B4B7F',JLB='#6D9AC4',JGR='#1E6B4F',JOR='#B8721A',JRD='#A81E2D',JPU='#2E6BA8',JTL='#16304F';

    // Metrics
    var total=filtered.length;
    var completados=filtered.filter(function(d){return d.estado==='Completado';}).length;
    var enProgreso=filtered.filter(function(d){return d.estado==='En progreso';}).length;
    var enRevision=filtered.filter(function(d){return d.estado==='En revisión';}).length;
    var pendientes=filtered.filter(function(d){return d.estado==='Pendiente';}).length;
    var hrsTotal=Math.round(filtered.reduce(function(s,d){return s+d.esfuerzo;},0));
    var hrsHechas=Math.round(filtered.filter(function(d){return d.estado==='Completado';}).reduce(function(s,d){return s+d.esfuerzo;},0));
    var pctDone=total?Math.round(completados/total*100):0;

    // Champion workload
    var champHrs=CHAMPIONS.map(function(c){
      return {label:c.split(' ')[0]+' '+c.split(' ')[1],full:c,
        hrs:Math.round(filtered.reduce(function(s,d){return s+splitHrs(d.champion,d.esfuerzo,c);},0)*10)/10,
        sols:filtered.filter(function(d){return d.champion.indexOf(c)!==-1;}).length};
    }).filter(function(d){return d.hrs>0||d.sols>0;}).sort(function(a,b){return b.hrs-a.hrs;});
    var mxChHrs=Math.max.apply(null,champHrs.map(function(d){return d.hrs;}).concat([1]));

    // Category breakdown
    var catData=CATEGORIAS.map(function(c){
      return {label:c,
        completado:filtered.filter(function(d){return d.categoria.indexOf(c)!==-1&&d.estado==='Completado';}).length,
        enProgreso:filtered.filter(function(d){return d.categoria.indexOf(c)!==-1&&d.estado==='En progreso';}).length,
        pendiente:filtered.filter(function(d){return d.categoria.indexOf(c)!==-1&&(d.estado==='Pendiente'||d.estado==='En revisión');}).length};
    }).filter(function(d){return d.completado+d.enProgreso+d.pendiente>0;});

    // 1. Cumplimiento por semana
    var allSems=filtered.reduce(function(acc,d){if(d.semana&&acc.indexOf(d.semana)===-1)acc.push(d.semana);return acc;},[])
      .sort(function(a,b){return semKey(a)-semKey(b);});
    var cumplData=allSems.map(function(sem){
      var rows=filtered.filter(function(d){return d.semana===sem;});
      var done=rows.filter(function(d){return d.estado==='Completado';}).length;
      return {sem:semLabel(sem),pct:rows.length?Math.round(done/rows.length*100):0,total:rows.length,done:done};
    });

    // 2. Solicitudes por tipo
    var tipoData=TIPOS.map(function(t){
      return {label:t,value:filtered.filter(function(d){return d.tipo===t;}).length};
    }).filter(function(d){return d.value>0;}).sort(function(a,b){return b.value-a.value;});
    var mxTipo=Math.max.apply(null,tipoData.map(function(d){return d.value;}).concat([1]));
    var tipoColors=[JBL,JPU,JGR,JOR,JRD,JTL,'#C64350','#2E6BA8','#2E6BA8'];

    // 3. Tiempo de entrega por prioridad (fecha solicitud → fecha entrega)
    var tiempoData=PRIORIDADES.map(function(pr){
      var items=filtered.filter(function(d){

      });
      var tiempos=items.map(function(d){
        var f1=new Date(d.fecha.split('/').reverse().join('-'));
        var f2=new Date(d.fechaLimite.split('/').reverse().join('-'));
        var diff=Math.round((f2-f1)/(1000*60*60*24));
        return isNaN(diff)?null:diff;
      }).filter(function(x){return x!==null&&x>=0;});
      var avg=tiempos.length?Math.round(tiempos.reduce(function(s,x){return s+x;},0)/tiempos.length):null;
      return {label:pr,avg:avg,count:tiempos.length,color:pr==='Alta'?JRD:pr==='Media'?JOR:JGR};
    });

    var prioData=PAISES.map(function(p){

      return {pais:p,alta:items.filter(function(d){return d.prioridad==='Alta';}).length,
        media:items.filter(function(d){return d.prioridad==='Media';}).length,
        baja:items.filter(function(d){return d.prioridad==='Baja';}).length,total:items.length};

    // 5. Aging — pending tasks by age buckets
    var now=new Date();
    var agingBuckets=[
      {label:'< 7 días',color:JGR,items:[]},

      {label:'15-30 días',color:JRD,items:[]},

    ];
    filtered.filter(function(d){return d.estado!=='Completado'&&d.fecha;}).forEach(function(d){
      var parts=d.fecha.split('/');
      var f;
      if(parts.length===3){

        f=new Date(parts[2]+'-'+parts[1]+'-'+parts[0]);
        if(isNaN(f)) f=new Date(d.fecha);
      }else{ f=new Date(d.fecha); }
      if(isNaN(f))return;
      var days=Math.round((now-f)/(1000*60*60*24));
      if(days<7)agingBuckets[0].items.push(d);
      else if(days<15)agingBuckets[1].items.push(d);
      else if(days<31)agingBuckets[2].items.push(d);
      else agingBuckets[3].items.push(d);

    // ── Sprint progress ───────────────────────────────────────────────────────
    // ── Vencimientos (tareas abiertas vs fecha límite) ───────────────────────
    function parseLim(s){
      if(!s) return null;
      var t=String(s).trim(), m;
      if((m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))
        return new Date(+m[1],+m[2]-1,+m[3]);
      if((m=t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/)))
        return new Date(+m[3],+m[2]-1,+m[1]);
      var d=new Date(t); return isNaN(d)?null:d;
    }

    var abiertas=filtered.filter(function(d){return d.estado!=='Completado';});

    abiertas.forEach(function(d){
      var lim=parseLim(d.fechaLimite);
      if(!lim){ vTiempo++; return; }
      var dias=Math.round((lim-_hoy)/86400000);
      if(dias<0) vVencidas.push({d:d,dias:-dias});
      else if(dias<=7) vProximas.push({d:d,dias:dias});
      else vTiempo++;
    });
    vVencidas.sort(function(a,b){return b.dias-a.dias;});

                h('span',{style:{color:JMT,flexShrink:0,display:'flex',alignItems:'center',gap:4}},bandera,corto));

    }

          [['ninguno','Sin agrupar'],['champion','Por champion'],['pais','Por país'],['prioridad','Por prioridad']].map(function(o){return h('option',{key:o[0],value:o[0]},o[1]);}))),
      h('button',{className:'btn btn-subtle'+(verArchivadas?' is-on':''),onClick:function(){setVerArchivadas(!verArchivadas);setLsel([]);},title:'Ver tareas archivadas'},h(Ico,{n:'archive',s:15}),'Archivadas'),
      h('button',{className:'icon-btn',onClick:exportarExcel,title:'Descargar a Excel lo que estás viendo'},h(Ico,{n:'download'})),
      h('button',{className:'icon-btn',onClick:reload,title:'Sincronizar con SharePoint'},h(Ico,{n:'refresh'}))));

  // Filtros activos como "píldoras" con X
  var pills=[];
  if(fc!=='Todos') pills.push(['Champion: '+fc,function(){setFc('Todos');}]);
  if(fp!=='Todos') pills.push(['País: '+fp,function(){setFp('Todos');}]);
  if(fpr!=='Todos') pills.push(['Prioridad: '+fpr,function(){setFpr('Todos');}]);
  if(fRango.desde&&fRango.hasta) pills.push([(fCampo==='fecha'?'Solicitud: ':'Límite: ')+isoFecha(fRango.desde)+' → '+isoFecha(fRango.hasta),function(){setFRango({desde:null,hasta:null});}]);
  if(search) pills.push(['"'+search+'"',function(){setSearch('');}]);
  var pillsEl=conFiltros&&pills.length>0&&h('div',{className:'pills'},
    pills.map(function(p,i){return h('span',{key:i,className:'fpill'},p[0],h('button',{onClick:p[1],title:'Quitar'},h(Ico,{n:'x',s:12})));}),
    pills.length>1&&h('button',{className:'btn btn-link',onClick:limpiarFiltros},'Limpiar todo'));

  var pct=filtered.length?Math.round(completados/filtered.length*100):0;
  var porEst=ESTADOS.map(function(e){return filtered.filter(function(d){return d.estado===e;}).length;});
  var stats=conStats&&h('div',{className:'stats'},
    h('span',null,h('b',null,filtered.length),hayFiltros?'de '+activos.length+' tareas':'tareas'),
    h('span',{className:'stat-bar',title:ESTADOS.map(function(e,i){return e+': '+porEst[i];}).join(' · ')},
      ESTADOS.map(function(e,i){return h('span',{key:e,style:{width:(filtered.length?porEst[i]/filtered.length*100:0)+'%',background:ST_COLOR[e]}});})),
    h('span',{className:'is-good'},h('b',null,pct+'%'),'completado'),
    h('span',{className:vencidasN?'is-bad':''},h('b',null,vencidasN),'vencidas'),
    h('span',{className:bloqueadasN?'is-warn':''},h('b',null,bloqueadasN),'bloqueadas'),
    h('span',null,h('b',null,altas),'alta prioridad'),
    h('span',null,h('b',null,Math.round(totalHrs)+' h'),'estimadas'));

  var ayuda=showAyuda&&h('div',{className:'modal-back',onMouseDown:function(e){if(e.target===e.currentTarget)setShowAyuda(false);}},
    h('div',{className:'help'},
      h('div',{className:'help-head'},h('b',null,'Atajos de teclado'),h('button',{className:'icon-btn icon-btn-lg',onClick:function(){setShowAyuda(false);}},h(Ico,{n:'x'}))),
      [['C','Crear solicitud'],['/','Buscar'],['1 – '+VISTAS.length,'Cambiar de vista'],['F','Abrir filtros'],['?','Mostrar / ocultar esta ayuda'],['Esc','Cerrar ventana'],['Ctrl + Enter','Guardar la tarea abierta'],['Clic derecho','Acciones rápidas sobre una tarea']]
      .map(function(r){return h('div',{key:r[0],className:'help-row'},h('kbd',null,r[0]),h('span',null,r[1]));}),
      h('div',{className:'muted small',style:{marginTop:12}},'Tip: copia el enlace de una tarea y compártelo; abre directo esa tarea.')));

  return h('div',{className:'app'+(navAbierta?' nav-open':''),onMouseDown:function(){if(ctx)setCtx(null);if(filtrosAbiertos)setFiltrosAbiertos(false);}},
    topbar,
    sidebar,
    h('div',{className:'scrim',onClick:function(){setNavAbierta(false);}}),
    h('div',{className:'main'},
      DEMO&&h('div',{className:'banner banner-demo'},'Modo demo · datos de ejemplo · nada se guarda en SharePoint'),
      toolbar,
      pillsEl,
      stats,
      h('div',{className:'content'},
        view==='kanban'&&kanban(),
        view==='mitrabajo'&&miTrabajo(),
        view==='lista'&&lista(),
        view==='timeline'&&cronograma(),
        view==='calendario'&&calendario(),
        view==='actividad'&&actividad(),
        view==='dashboard'&&(isAdmin?h('div',null,panelEjecutivo(),dashboard()):h(SinAcceso,null)),
        view==='encuesta'&&(isAdmin?vistaEncuesta():h(SinAcceso,null))),
      h('footer',{className:'legal'},
        h('span',null,'© '+new Date().getFullYear()+' Retail Latam Business Solutions (RETAILATAM). Todos los derechos reservados.'),
        h('span',null,'Herramienta de uso interno y confidencial. Prohibida su reproducción o distribución sin autorización.'))),
    menuContextual(),
    sel&&h(IssueModal,{key:'e'+sel.id,item:sel,paises:paisesUser,onClose:function(){setSel(null);},onSave:updateItem,onArchive:archivar,onDuplicate:duplicar,onDelete:isAdmin?function(it){eliminar([it]);}:null,
      comentarios:comentarios,onAddComment:addComment,isAdmin:isAdmin}),
    showNew&&h(IssueModal,{key:'nuevo',isNew:true,paises:paisesUser,onClose:function(){setShowNew(false);setNuevoBase(null);},onAdd:addItem,isAdmin:isAdmin,
      item:nuevoBase?Object.assign({},nuevoBase,{id:nextId}):tareaBase()}),
    ayuda,
    isAdmin&&h(Reporte,{data:repData(),filtros:repFiltros()}),
    isAdmin&&showOrden&&h(OrdenModal,{
      ordenData:ordenData,
      onClose:function(){setShowOrden(false);},
      onGenerar:function(pa,narr,valor){
        setOrdenPais(pa); setOrdenNarr(narr); setOrdenValor(valor); setShowOrden(false);
        setTimeout(function(){
          document.body.classList.add('print-orden');
          window.print();
          setTimeout(function(){document.body.classList.remove('print-orden');},500);
        },50);
      }}),
    isAdmin&&h(OrdenTrabajo,{data:ordenData(ordenPais),narrativa:ordenNarr,valor:ordenValor||'$ 0.00 (no incluye IVA)'}),
    toast&&h('div',{className:'toast'+(toast.type==='err'?' toast-err':'')},
      h('span',null,toast.msg),
      toast.accion&&h('button',{className:'toast-btn',onClick:function(){var a=toast.accion;setToast(null);a.fn();}},toast.accion.label)));
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
